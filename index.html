<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

  <!-- Primary Meta Tags -->
  <title>Syntaxable | Collaborative Code Editor & Practice Platform</title>
  <meta name="title" content="Syntaxable | Collaborative Code Editor & Practice Platform" />
  <meta name="description"
    content="Syntaxable is a premium collaborative code editor and programming practice platform. Write, compile, and learn coding with friends globally in real-time." />
  <meta name="keywords"
    content="coding, collaborative coding, code editor, online compiler, practice programming, syntaxable, learn to code, algorithms, data structures, pair programming" />
  <meta name="author" content="Syntaxable" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook / LinkedIn / Discord -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://syntaxable.org/" />
  <meta property="og:title" content="Syntaxable | Collaborative Code Editor & Practice" />
  <meta property="og:description"
    content="Syntaxable is a premium collaborative code editor and programming practice platform. Write, compile, and learn coding with friends globally in real-time." />
  <meta property="og:image" content="/syntaxable.png" />
  <meta property="og:site_name" content="Syntaxable" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://syntaxable.com/" />
  <meta property="twitter:title" content="Syntaxable | Collaborative Code Editor & Practice" />
  <meta property="twitter:description"
    content="Syntaxable is a premium collaborative code editor and programming practice platform. Write, compile, and learn coding with friends globally in real-time." />
  <meta property="twitter:image" content="/syntaxable.png" />

  <link rel="icon" type="image/png" href="/syntaxable.png" />
  <link rel="apple-touch-icon" href="/syntaxable.png" />
  <link rel="canonical" href="https://syntaxable.com/" />
  <link rel="manifest" href="/manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-initial: #ffffff;
    }

    html[data-theme='dark'] {
      --bg-initial: #09090b;
    }

    html,
    body,
    #root {
      height: 100%;
      width: 100%;
      background-color: var(--bg-initial);
      margin: 0;
      padding: 0;
      font-family: 'PT Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-initial);
      z-index: 9999;
      transition: opacity 0.2s ease-out;
    }

    .loader-text {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #d4d4d8;
      background: linear-gradient(
        90deg,
        #d4d4d8 0%,
        #d4d4d8 40%,
        #a1a1aa 50%,
        #d4d4d8 60%,
        #d4d4d8 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 2s ease-in-out infinite;
    }

    html[data-theme='dark'] .loader-text {
      color: #3f3f46;
      background: linear-gradient(
        90deg,
        #3f3f46 0%,
        #3f3f46 40%,
        #52525b 50%,
        #3f3f46 60%,
        #3f3f46 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('app-theme') || 'light';
        if (theme !== 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="initial-loader">
    <div class="loader-text">Syntaxable</div>
  </div>
  
  <div id="root"></div>
  
  <script>
    // Fade out smoothly and then remove the loader gracefully once React connects to #root
    var observer = new MutationObserver(function() {
      var root = document.getElementById('root');
      if (root && root.children.length > 0) {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(function() { loader.remove(); }, 200); // 200ms quick fade out
        }
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker registered successfully:', reg.scope))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>

</html>
